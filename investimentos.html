<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investimentos — Meu Norte Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-header">
  <div class="app-logo">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="47" stroke="#FAF7F1" stroke-width="4" opacity="0.5"/>
      <path d="M50 14 L61 50 L50 86 L39 50 Z" fill="#D9B564"/>
    </svg>
    Meu Norte Financeiro
  </div>
  <div class="app-header-right">
    <span id="user-email"></span>
    <button class="logout-btn" onclick="fazerLogout()">Sair</button>
  </div>
</header>

<nav class="tab-bar">
  <a href="visao-geral.html" class="tab-item">Visão geral</a>
  <a href="financeiro.html" class="tab-item">Financeiro</a>
  <a href="metas.html" class="tab-item">Metas</a>
  <a href="investimentos.html" class="tab-item active">Investimentos</a>
  <a href="dashboard.html" class="tab-item">Clientes</a>
  <a href="relatorios.html" class="tab-item">Relatórios</a>
  <a href="admin.html" class="tab-item">Admin</a>
</nav>

<main class="app-main">
  <div class="section-title-row">
    <h1>Investimentos</h1>
  </div>

  <div class="stats-row" id="stats-row" style="display:none;">
    <div class="stat-card">
      <div class="label">Total investido</div>
      <div class="value" id="stat-total-investido">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Rentabilidade média (ponderada)</div>
      <div class="value positive" id="stat-rentabilidade">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Aplicações registradas</div>
      <div class="value" id="stat-qtd">—</div>
    </div>
  </div>

  <div id="loading" class="loading-state">Carregando investimentos...</div>
  <div id="empty" class="empty-state" style="display:none;"></div>

  <div class="card" id="table-card" style="display:none;">
    <table class="simple-table">
      <thead>
        <tr><th>Cliente</th><th>Tipo</th><th>Valor aplicado</th><th>Rentabilidade</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/authGuard.js"></script>
<script>
  function formatBRL(v) {
    return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  async function carregar() {
    const { data: session } = await supabaseClient.auth.getSession();
    if (session.session) document.getElementById('user-email').textContent = session.session.user.email;

    const [{ data: investimentos, error: e1 }, { data: clientes, error: e2 }] = await Promise.all([
      supabaseClient.from('investimentos').select('*').order('valor_aplicado', { ascending: false }),
      supabaseClient.from('clientes').select('id, nome')
    ]);

    document.getElementById('loading').style.display = 'none';

    if (e1 || e2) {
      const msg = (e1 && e1.message) || (e2 && e2.message) || 'erro desconhecido';
      document.getElementById('empty').textContent = 'Erro ao carregar investimentos: ' + msg + '. Você já rodou o script schema_investimentos.sql no Supabase?';
      document.getElementById('empty').style.display = 'block';
      return;
    }
    if (!investimentos || investimentos.length === 0) {
      document.getElementById('empty').textContent = 'Nenhum investimento cadastrado ainda.';
      document.getElementById('empty').style.display = 'block';
      return;
    }

    const nomeCliente = Object.fromEntries((clientes || []).map(c => [c.id, c.nome]));

    const totalInvestido = investimentos.reduce((s, i) => s + Number(i.valor_aplicado || 0), 0);
    const rentabilidadePonderada = totalInvestido
      ? investimentos.reduce((s, i) => s + Number(i.valor_aplicado || 0) * Number(i.rentabilidade_pct || 0), 0) / totalInvestido
      : 0;

    document.getElementById('stat-total-investido').textContent = formatBRL(totalInvestido);
    document.getElementById('stat-rentabilidade').textContent = rentabilidadePonderada.toFixed(1) + '% a.a.';
    document.getElementById('stat-qtd').textContent = investimentos.length;
    document.getElementById('stats-row').style.display = 'grid';

    document.getElementById('table-body').innerHTML = investimentos.map(i => `
      <tr>
        <td>${nomeCliente[i.cliente_id] || '—'}</td>
        <td><span class="pill">${i.tipo}</span></td>
        <td>${formatBRL(i.valor_aplicado)}</td>
        <td class="muted">${Number(i.rentabilidade_pct).toFixed(1)}% a.a.</td>
      </tr>
    `).join('');
    document.getElementById('table-card').style.display = 'block';
  }

  carregar();
</script>
</body>
</html>
