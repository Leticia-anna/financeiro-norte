<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Meu Norte Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="47" stroke="#0B1F35" stroke-width="4"/>
        <path d="M50 14 L61 50 L50 86 L39 50 Z" fill="#C89B3C"/>
        <circle cx="50" cy="50" r="5" fill="#0B1F35"/>
      </svg>
      Meu Norte Financeiro
    </div>
    <div class="subtitle">Painel do assessor — entre com sua conta</div>

    <div class="form-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
  // Se já estiver logado, vai direto para o painel
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) window.location.href = 'dashboard.html';
  })();

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = 'E-mail ou senha incorretos. Verifique e tente novamente.';
      errorBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
